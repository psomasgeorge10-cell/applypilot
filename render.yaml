# Render Blueprint: one click deploys the app and its PostgreSQL database.
# See the "Launch it online" section of README.md.
#
# The web service also runs the scheduled job search (SCHEDULER_INTERVAL_MINUTES),
# so there is no separate worker to pay for. It needs an always-on plan for
# that: free web services sleep when idle.

services:
  - type: web
    name: applypilot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: applypilot-db
          property: connectionString
      - key: DATABASE_AUTO_MIGRATE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      # Render asks for these two when you deploy.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SIGNUP_ALLOWLIST
        sync: false
      # Dry run until you flip this to "true" in the Render dashboard.
      - key: APPLY_LIVE
        value: "false"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "60"

databases:
  - name: applypilot-db
    plan: basic-256mb
    databaseName: applypilot
    user: applypilot
